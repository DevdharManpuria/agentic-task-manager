# One-command start:  cp .env.example .env  (fill in the secrets)  then  docker compose up --build
# The app is then at http://localhost:8080 (UI) and http://localhost:8080/swagger-ui/index.html (API docs).
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_DATABASE: taskmanager
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      DB_URL: jdbc:mysql://mysql:3306/taskmanager
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      MONGODB_URI: mongodb://mongo:27017/taskmanager_logs
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (at least 32 random characters)}
      LLM_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      LLM_API_URL: ${LLM_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}

volumes:
  mysql-data:
  mongo-data:
