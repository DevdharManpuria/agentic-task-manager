spring.application.name=agentic-task-manager
spring.config.import=optional:file:./application-local.properties

# ---- MySQL (relational: users, tasks) ----
spring.datasource.url=jdbc:mysql://localhost:3306/taskmanager?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- MongoDB (agent interaction logs) ----
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/taskmanager_logs}

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ---- LLM provider (any OpenAI-compatible chat-completions endpoint) ----
app.llm.api-key=${LLM_API_KEY}
app.llm.api-url=${LLM_API_URL:https://api.groq.com/openai/v1/chat/completions}
app.llm.model=${LLM_MODEL:openai/gpt-oss-120b}

server.port=8080